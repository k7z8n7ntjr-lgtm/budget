<style>
/* Layout: one narrow column — month bar, budget card (drag source), 4-column category grid, floating "+" */
:root {
  --bg: #F3F4F1;
  --surface: #FFFFFF;
  --fg: #1B1E1C;
  --muted: #747A76;
  --line: #E2E5E0;
  --track: #E6E9E4;
  --accent: #24584A;
  --accent-ink: #FFFFFF;
  --danger: #D2382A;
  --danger-tint: #FCE9E6;
  --ok: #2F9A5B;
  --warn: #E0A019;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-num: -apple-system, BlinkMacSystemFont, "SF Pro Rounded", "SF Pro Display", "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { background: var(--bg); color: var(--fg); height: 100%; }
body { display: flex; flex-direction: column; overflow: hidden; }
body { font-family: var(--font); font-size: 15px; line-height: 1.35; }
.pwa body { padding-top: env(safe-area-inset-top, 0px); }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible, input:focus-visible, .seg label:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }

.app {
  flex: 1; min-height: 0; width: 100%; max-width: 520px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 2px 0;
  display: flex; flex-direction: column; gap: 10px;
}
.app > * { flex: none; }

/* month bar */
.bar { display: grid; grid-template-columns: 40px 1fr 40px; align-items: center; min-height: 44px; }
.month { grid-column: 2; justify-self: center; display: flex; align-items: center; gap: 0; }
.month h1 { font-size: 20px; font-weight: 700; margin: 0; min-width: 6.6em; text-align: center; letter-spacing: -0.01em; white-space: nowrap; }
#settings-btn { grid-column: 3; }
.icon-btn { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; color: var(--fg); }
.icon-btn:active { background: var(--track); }
.icon-btn[disabled] { opacity: .25; cursor: default; }
.icon-btn svg { width: 22px; height: 22px; }

/* demo banner */
.demo { display: flex; align-items: center; gap: 12px; justify-content: space-between; background: #FFF6DD; color: #6A5312; border-radius: 14px; padding: 10px 12px; font-size: 13px; }
.demo button { font-weight: 600; white-space: nowrap; color: #6A5312; text-decoration: underline; }

/* budget card */
.budget { background: var(--surface); border-radius: 20px; padding: 12px 14px; display: flex; align-items: center; gap: 14px; }
.budget-src { position: relative; flex: none; width: 64px; height: 64px; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; border-radius: 50%; }
.budget-src .disc-in { background: var(--accent); color: var(--accent-ink); }
.budget-src.lifted { transform: scale(.92); opacity: .5; transition: transform .15s, opacity .15s; }
.budget-info { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 1px; }
.remain { display: flex; flex-wrap: wrap-reverse; align-items: baseline; column-gap: 8px; }
.remain.over .big, .remain.over .label { color: var(--danger); }
.label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
.big { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; }
.budget-info .of { color: var(--muted); font-size: 14px; }
.hint { font-size: 12px; color: var(--muted); margin-top: 3px; line-height: 1.3; }

/* disc + ring (shared by budget and categories) */
.disc { position: relative; display: block; width: 100%; height: 100%; }
.disc svg.ring { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
.disc-in { position: absolute; inset: 9%; border-radius: 50%; display: grid; place-items: center; background: var(--tint, var(--track)); color: var(--c, var(--muted)); }
.disc-in svg { width: 44%; height: 44%; }
.disc.nolimit .disc-in { background: var(--track); }
.disc.over .disc-in { background: var(--danger-tint); }

/* category grid */
/* Grid fills what is left of the screen; circles scale with the height, and only the grid scrolls once they hit the minimum. */
.grid-wrap { flex: 1 1 auto !important; min-height: 0; container-type: size; }
.grid { height: 100%; overflow-y: auto; overscroll-behavior: contain; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px 4px; align-content: start; padding-bottom: 8px;
  --d: clamp(48px, calc((100cqh - (var(--rows, 3) - 1) * 8px) / var(--rows, 3) - 78px), 76px); }
.cat { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; padding: 6px 2px; border-radius: 16px; transition: background .12s, transform .12s; }
.cat:active { background: var(--track); }
.cat-name { font-size: 12px; color: var(--muted); max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cat .disc { width: min(var(--d), calc(25cqw - 12px)); height: min(var(--d), calc(25cqw - 12px)); }
.cat-spent { font-size: 15px; font-weight: 600; white-space: nowrap; }
.cat-limit { font-size: 11px; color: var(--muted); white-space: nowrap; min-height: 14px; }
.cat.over .cat-spent, .cat.over .cat-limit { color: var(--danger); }
.cat.drop { background: color-mix(in srgb, var(--accent) 12%, transparent); transform: scale(1.06); }
.cat.add .disc-in { background: transparent; border: 2px dashed #C3C8C2; color: var(--muted); inset: 9%; }
body.dragging .cat:not(.add) .disc-in { box-shadow: 0 0 0 2px var(--surface), 0 0 0 3px var(--line); }

.ghost { position: fixed; left: 0; top: 0; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-size: 24px; font-weight: 700; pointer-events: none; z-index: 50; box-shadow: 0 8px 24px rgba(20,40,30,.3); }

/* Bottom bar: full width, a soft hill that peaks in the middle; the whole bar adds an expense. */
.addbar { flex: none; position: relative; display: block; width: 100%; height: calc(78px + env(safe-area-inset-bottom, 0px)); color: var(--accent-ink); z-index: 5; }
.addbar .shape { position: absolute; left: 0; top: 0; width: 100%; height: 78px; display: block; filter: drop-shadow(0 -3px 10px rgba(20,60,45,.16)); }
.addbar .shape path { fill: var(--accent); }
.addbar::after { content: ""; position: absolute; left: 0; right: 0; top: 77px; bottom: 0; background: var(--accent); }
.addbar .plus { position: absolute; left: 50%; top: 16px; width: 44px; height: 44px; margin-left: -22px; display: grid; place-items: center; transition: transform .12s; }
.addbar .plus svg { width: 40px; height: 40px; stroke-width: 2.4; }
.addbar:active .plus { transform: scale(.9); }
.addbar:focus-visible { outline: none; }
.addbar:focus-visible .plus { outline: 2px solid var(--accent-ink); outline-offset: 2px; border-radius: 50%; }

/* sheets */
.backdrop { position: fixed; inset: 0; background: rgba(20,24,22,.32); z-index: 20; opacity: 0; transition: opacity .2s; }
.backdrop.on { opacity: 1; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; max-width: 560px; margin: 0 auto; max-height: 92dvh; overflow-y: auto; overscroll-behavior: contain; background: var(--surface); border-radius: 22px 22px 0 0; padding: 8px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); transform: translateY(100%); transition: transform .24s cubic-bezier(.2,.8,.2,1); display: flex; flex-direction: column; gap: 14px; }
.sheet.on { transform: none; }
@media (prefers-reduced-motion: reduce) { .sheet, .backdrop, .cat { transition: none; } }
.grab { width: 36px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 2px; flex: none; }
.sheet-head { display: flex; align-items: center; gap: 10px; }
.sheet-head h2 { font-size: 18px; margin: 0; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sheet-head .disc { width: 40px; height: 40px; flex: none; }

.amount { display: flex; align-items: baseline; gap: 6px; border-bottom: 2px solid var(--line); padding-bottom: 4px; }
.amount:focus-within { border-color: var(--accent); }
.amount input { flex: 1; min-width: 0; border: 0; outline: 0; font-family: var(--font-num); font-size: 38px; font-weight: 700; padding: 0; background: transparent; color: var(--fg); }
.amount span { font-size: 28px; color: var(--muted); font-weight: 600; }
.row { display: flex; gap: 8px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; flex: 1; }
.field > span { font-size: 12px; color: var(--muted); }
.input { width: 100%; font: inherit; font-size: 16px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); min-width: 0; -webkit-appearance: none; appearance: none; }
input[type=date].input { min-height: 44px; }
.row .field.date { flex: 0 0 140px; }

.pick { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 8px 4px; }
.pick button { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 2px; border-radius: 14px; min-width: 0; }
.pick .disc { width: 44px; height: 44px; }
.pick small { font-size: 11px; color: var(--muted); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pick button[aria-pressed=true] { background: color-mix(in srgb, var(--accent) 12%, transparent); }
.pick button[aria-pressed=true] small { color: var(--fg); font-weight: 600; }
.sub { font-size: 13px; color: var(--muted); }

.btn { min-height: 50px; border-radius: 14px; font-weight: 600; font-size: 16px; padding: 0 16px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.primary[disabled] { opacity: .35; }
.btn.soft { background: var(--bg); }
.btn.danger { color: var(--danger); }
.btn.danger.armed { background: var(--danger); color: #fff; }
.btn svg { width: 20px; height: 20px; }
.actions { display: flex; flex-direction: column; gap: 8px; }

.summary { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 14px; color: var(--muted); }
.summary b { color: var(--fg); font-weight: 600; }
.summary .over { color: var(--danger); font-weight: 600; }
.day { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; font-weight: 600; margin-top: 4px; }
.tx { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); width: 100%; text-align: left; }
.tx .c { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tx .c.none { color: var(--muted); }
.tx .a { font-weight: 600; white-space: nowrap; }
.list { display: flex; flex-direction: column; }
.empty { color: var(--muted); text-align: center; padding: 20px 0; }

.seg { display: flex; background: var(--bg); border-radius: 12px; padding: 3px; }
.seg label { flex: 1; text-align: center; padding: 8px 4px; border-radius: 10px; font-size: 14px; cursor: pointer; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label:has(input:checked) { background: var(--surface); box-shadow: 0 1px 3px rgba(0,0,0,.1); font-weight: 600; }
.icons { display: grid; grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); gap: 6px; }
.icons button { aspect-ratio: 1; max-width: 100%; border-radius: 12px; display: grid; place-items: center; color: var(--muted); background: var(--bg); }
.icons button svg { width: 22px; height: 22px; }
.icons button[aria-pressed=true] { background: var(--c); color: #fff; }
.colors { display: flex; flex-wrap: wrap; gap: 10px; }
.colors button { width: 32px; height: 32px; border-radius: 50%; background: var(--sw); }
.colors button[aria-pressed=true] { box-shadow: 0 0 0 3px var(--surface), 0 0 0 5px var(--sw); }

.switch { display: flex; align-items: flex-start; gap: 12px; }
.switch input { appearance: none; -webkit-appearance: none; flex: none; width: 50px; height: 30px; border-radius: 15px; background: var(--line); position: relative; transition: background .15s; margin: 0; }
.switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.2); transition: transform .15s; }
.switch input:checked { background: var(--ok); }
.switch input:checked::after { transform: translateX(20px); }
.legend { display: flex; gap: 10px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; vertical-align: 1px; }
hr { border: 0; border-top: 1px solid var(--line); margin: 2px 0; width: 100%; }
textarea.input { min-height: 120px; font-family: ui-monospace, Menlo, monospace; font-size: 12px; }

.toast { position: fixed; left: 50%; top: calc(12px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); background: var(--fg); color: #fff; padding: 10px 16px; border-radius: 12px; font-size: 14px; z-index: 60; max-width: calc(100% - 32px); }
</style>
</head>

const ymParts = (ym) => ym.split('-').map(Number);

function parseAmount(s) {

  if (!s || !/^[\d.+]+$/.test(s)) return NaN;

}

function load() {

/* ---------- computations ---------- */
const catById = (id) => S.categories.find((c) => c.id === id);
const txIn = (ym) => S.tx.filter((t) => ymOf(t.date) === ym);
function visibleCats(ym) {
  const used = new Set(txIn(ym).map((t) => t.cat));
  return S.categories.filter((c) => (c.created || '0000-00') <= ym || used.has(c.id));
}
function monthFraction(ym) {
  const cur = ymOf(today());
  if (ym < cur) return 1;
  if (ym > cur) return 0;
  return new Date().getDate() / daysIn(ym);
}
// Returns {state, ring} where state ∈ none|neutral|ok|warn|over
function catState(cat, spent, limit, ym) {
  if (limit == null) return { state: 'none', ring: null };
  if (spent > limit) return { state: 'over', ring: 'var(--danger)' };
  if (!S.settings.pace) return { state: 'neutral', ring: cat.color };
  if (cat.type === 'oneoff') return { state: 'ok', ring: 'var(--ok)' };
  const expected = Math.max(limit * monthFraction(ym), limit * 0.12); // buffer for the first days of the month
  const pace = spent / expected;
  if (pace <= 1) return { state: 'ok', ring: 'var(--ok)' };
  if (pace <= 1.2) return { state: 'warn', ring: 'var(--warn)' };
  return { state: 'over', ring: 'var(--danger)' };
}

/* ---------- rendering ---------- */
function disc({ iconName, color, pct = null, ring = null, cls = '', inner = '' }) {
  const r = 46, C = 2 * Math.PI * r;
  const p = pct == null ? 0 : Math.max(0, Math.min(1, pct));
  const ringSvg = pct == null ? '' : `<svg class="ring" viewBox="0 0 100 100" aria-hidden="true">
      <circle cx="50" cy="50" r="${r}" fill="none" stroke="var(--track)" stroke-width="6"/>
      <circle cx="50" cy="50" r="${r}" fill="none" stroke="${ring}" stroke-width="6" stroke-linecap="round" stroke-dasharray="${(p === 0 ? 0 : Math.max(C * p, 10)).toFixed(2)} ${C.toFixed(2)}" ${p === 0 ? 'stroke-opacity="0"' : ''}/>
    </svg>`;
  const style = color ? `--c:${color};--tint:${hexA(color, 0.13)}` : '';
  return `<span class="disc ${cls}" style="${style}">${ringSvg}<span class="disc-in">${inner || icon(iconName)}</span></span>`;
}

function render() {
  const cur = ymOf(today());
  $('#month-title').textContent = monthTitle(view);
  $('#next').disabled = view >= cur;

  const txs = txIn(view);
  const spentBy = {};
  let total = 0;
  for (const t of txs) { spentBy[t.cat] = (spentBy[t.cat] || 0) + t.amount; total += t.amount; }

  // demo banner
  const hasDemo = S.tx.some((t) => t.demo);
  $('#demo').innerHTML = hasDemo ? `<div class="demo"><span>Сейчас показаны примеры трат, чтобы было видно, как всё работает.</span><button id="clear-demo">Убрать примеры</button></div>` : '';
  if (hasDemo) $('#clear-demo').onclick = () => { S.tx = S.tx.filter((t) => !t.demo); save(); render(); toast('Примеры удалены'); };

  // budget
  const budget = limitAt(S.budget, view);
  const over = budget != null && total > budget;
  const left = budget == null ? null : budget - total;
  $('#budget').innerHTML = `
    <button class="budget-src" id="budget-src" aria-label="Добавить трату. Зажмите и перетащите на категорию">

        ? `<div class="remain ${over ? 'over' : ''}"><span class="big num">${over ? '−' + rub(-left) : rub(left)}</span><span class="label">${over ? 'Перерасход' : 'Осталось'}</span></div>

  $('#grid').innerHTML = cats.map((c) => {
    const spent = spentBy[c.id] || 0;

      <span class="cat-name">${esc(c.name)}</span>

      <span class="cat-name">Категория</span>
      ${disc({ inner: icon('plus') })}

    </button>`;

/* ---------- drag from budget ---------- */
let suppressClick = false;
function setupDrag(src) {
  let start = null, dragging = false, ghost = null, overEl = null, timer = null;
  const begin = (x, y) => {
    if (dragging) return;
    dragging = true; clearTimeout(timer);
    src.classList.add('lifted'); document.body.classList.add('dragging');
    ghost = document.createElement('div'); ghost.className = 'ghost'; ghost.textContent = '₽';
    document.body.appendChild(ghost); move(x, y);
    if (navigator.vibrate) navigator.vibrate(8);
  };
  const move = (x, y) => {
    ghost.style.transform = `translate(${x}px, ${y}px)`;
    const el = document.elementFromPoint(x, y);
    const target = el && el.closest('.cat[data-cat]');
    if (target !== overEl) { overEl && overEl.classList.remove('drop'); overEl = target; overEl && overEl.classList.add('drop'); }
  };
  const finish = () => {
    clearTimeout(timer);
    const id = overEl && overEl.dataset.cat;
    overEl && overEl.classList.remove('drop');
    ghost && ghost.remove();
    src.classList.remove('lifted'); document.body.classList.remove('dragging');
    const wasDragging = dragging;
    start = null; dragging = false; ghost = null; overEl = null;
    return { wasDragging, id };
  };
  src.addEventListener('contextmenu', (e) => e.preventDefault());
  src.addEventListener('pointerdown', (e) => {
    if (e.button > 0) return;
    start = { x: e.clientX, y: e.clientY };
    try { src.setPointerCapture(e.pointerId); } catch (_) {}
    timer = setTimeout(() => start && begin(start.x, start.y), 250);
  });
  src.addEventListener('pointermove', (e) => {
    if (!start) return;
    if (!dragging && Math.hypot(e.clientX - start.x, e.clientY - start.y) > 6) begin(e.clientX, e.clientY);
    if (dragging) move(e.clientX, e.clientY);
  });
  src.addEventListener('pointerup', () => {
    if (!start) return;
    const { wasDragging, id } = finish();
    if (wasDragging) { suppressClick = true; setTimeout(() => (suppressClick = false), 400); if (id) openTx({ catId: id }); }
  });
  src.addEventListener('pointercancel', finish);
  src.addEventListener('click', () => { if (suppressClick) { suppressClick = false; return; } openTx({}); });
}

/* ---------- sheets ---------- */
let sheetEl = null, backdropEl = null;
function openSheet(html) {
  closeSheet(true);
  backdropEl = document.createElement('div'); backdropEl.className = 'backdrop';
  sheetEl = document.createElement('div'); sheetEl.className = 'sheet'; sheetEl.setAttribute('role', 'dialog'); sheetEl.setAttribute('aria-modal', 'true');
  sheetEl.innerHTML = `<div class="grab"></div>${html}`;
  backdropEl.onclick = () => closeSheet();
  document.body.append(backdropEl, sheetEl);
  requestAnimationFrame(() => { backdropEl.classList.add('on'); sheetEl.classList.add('on'); });
  sheetEl.querySelectorAll('[data-close]').forEach((b) => b.onclick = () => closeSheet());
  return sheetEl;
}
function closeSheet(instant) {
  const s = sheetEl, b = backdropEl;
  sheetEl = backdropEl = null;
  if (!s) return;
  if (instant) { s.remove(); b.remove(); return; }
  s.classList.remove('on'); b.classList.remove('on');
  setTimeout(() => { s.remove(); b.remove(); }, 250);
}
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && sheetEl) closeSheet(); });
const closeBtn = `<button class="icon-btn" data-close aria-label="Закрыть">${icon('x')}</button>`;

      ${quick ? '' : `<button class="btn primary" id="tx-save">${isEdit ? 'Сохранить' : 'Записать трату'}</button>`}

    const date = $('#tx-date', s).value || defDate;
    const comment = $('#tx-comment', s).value.trim();
    if (isEdit) Object.assign(t, { amount, date, comment, cat, demo: false });
    else S.tx.push({ id: uid(), cat, amount, date, comment });
    save();
    if (ymOf(date) !== view && !isEdit) view = ymOf(date) > cur ? cur : ymOf(date);
    render(); closeSheet();
    toast(`${rub(amount)} → ${catById(cat).name}`);
    if (back) setTimeout(back, 260);
    return true;
  };
  $('#tx-cats', s).onclick = (e) => {
    const b = e.target.closest('[data-c]'); if (!b) return;
    cat = b.dataset.c;
    s.querySelectorAll('#tx-cats [data-c]').forEach((x) => x.setAttribute('aria-pressed', x === b));
    if (quick) commit();
  };
  const saveBtn = $('#tx-save', s);
  if (saveBtn) saveBtn.onclick = commit;
  amountEl.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !quick) commit(); });
  const del = $('#tx-del', s);
  if (del) del.onclick = () => {
    if (!del.classList.contains('armed')) { del.classList.add('armed'); del.textContent = 'Нажмите ещё раз, чтобы удалить'; return; }
    S.tx = S.tx.filter((x) => x.id !== t.id); save(); render(); closeSheet(); toast('Трата удалена');
    if (back) setTimeout(back, 260);
  };
}

/* --- category: list of expenses --- */
function openCategory(id) {
  const c = catById(id); if (!c) return;
  const txs = txIn(view).filter((t) => t.cat === id).sort((a, b) => b.date.localeCompare(a.date) || (b.id > a.id ? 1 : -1));
  const spent = txs.reduce((a, t) => a + t.amount, 0);
  const limit = limitAt(c.limits, view);
  let list = '', lastDay = '';
  for (const t of txs) {
    if (t.date !== lastDay) {
      lastDay = t.date;
      const [y, m, d] = t.date.split('-').map(Number);
      list += `<div class="day">${new Date(y, m - 1, d).toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', weekday: 'short' })}</div>`;
    }
    list += `<button class="tx" data-t="${t.id}"><span class="c ${t.comment ? '' : 'none'}">${esc(t.comment || 'Без комментария')}</span><span class="a num">${rub(t.amount)}</span></button>`;
  }
  const summary = limit == null
    ? `<span>Потрачено <b class="num">${rub(spent)}</b></span><span>без лимита</span>`
    : `<span>Потрачено <b class="num">${rub(spent)}</b> из <b class="num">${rub(limit)}</b></span>` +
      (spent > limit ? `<span class="over num">перерасход ${rub(spent - limit)}</span>` : `<span class="num">осталось ${rub(limit - spent)}</span>`);
  const s = openSheet(`
    <div class="sheet-head">${disc({ iconName: c.icon, color: c.color })}<h2>${esc(c.name)}</h2>
      <button class="icon-btn" id="cat-edit" aria-label="Настроить категорию">${icon('pencil')}</button>${closeBtn}</div>
    <div class="summary">${summary}</div>
    <button class="btn primary" id="cat-add">${icon('plus')} Добавить трату</button>
    <div class="list">${list || `<div class="empty">В ${esc(monthIn(view))} трат нет</div>`}</div>`);
  const back = () => openCategory(id);
  $('#cat-add', s).onclick = () => openTx({ catId: id, back });
  $('#cat-edit', s).onclick = () => openCategoryEdit(id);
  s.querySelectorAll('[data-t]').forEach((b) => b.onclick = () => openTx({ id: b.dataset.t, back }));
}

/* --- category: create / edit --- */
function openCategoryEdit(id) {
  const c = id ? catById(id) : null;
  const used = new Set(S.categories.map((x) => x.color));
  let ic = c ? c.icon : 'dots';
  let col = c ? c.color : (COLORS.find((x) => !used.has(x)) || COLORS[0]);
  const limit = c ? limitAt(c.limits, view) : null;
  const count = c ? S.tx.filter((t) => t.cat === c.id).length : 0;
  const s = openSheet(`
    <div class="sheet-head"><h2>${c ? 'Настройка категории' : 'Новая категория'}</h2>${closeBtn}</div>
    <label class="field"><span>Название</span><input class="input" id="ce-name" maxlength="24" value="${esc(c ? c.name : '')}" placeholder="Например, Кафе"></label>
    <label class="field"><span>Лимит на месяц, ₽ — действует с ${esc(monthIn(view))} и дальше</span><input class="input num" id="ce-limit" inputmode="decimal" placeholder="Без лимита" value="${limit != null ? limit : ''}"></label>
    <div class="field"><span>Как тратится</span>
      <div class="seg" role="radiogroup">
        <label><input type="radio" name="ce-type" value="even" ${!c || c.type !== 'oneoff' ? 'checked' : ''}>Равномерно</label>
        <label><input type="radio" name="ce-type" value="oneoff" ${c && c.type === 'oneoff' ? 'checked' : ''}>Разовый платёж</label>
      </div>
      <span>Нужно для подсветки темпа: разовые платежи (ЖКУ, подписки) красятся только при превышении лимита.</span>
    </div>
    <div class="field"><span>Иконка</span><div class="icons" id="ce-icons" style="--c:${col}">${CAT_ICONS.map((n) => `<button data-i="${n}" aria-pressed="${n === ic}" aria-label="${n}">${icon(n)}</button>`).join('')}</div></div>
    <div class="field"><span>Цвет</span><div class="colors" id="ce-colors">${COLORS.map((x) => `<button data-col="${x}" style="--sw:${x}" aria-pressed="${x === col}" aria-label="Цвет ${x}"></button>`).join('')}</div></div>
    <div class="actions">
      <button class="btn primary" id="ce-save">${c ? 'Сохранить' : 'Создать категорию'}</button>
      ${c ? `<button class="btn danger" id="ce-del">Удалить категорию</button>` : ''}
    </div>`);
  if (!c) $('#ce-name', s).focus();
  $('#ce-icons', s).onclick = (e) => { const b = e.target.closest('[data-i]'); if (!b) return; ic = b.dataset.i; s.querySelectorAll('#ce-icons button').forEach((x) => x.setAttribute('aria-pressed', x === b)); };
  $('#ce-colors', s).onclick = (e) => { const b = e.target.closest('[data-col]'); if (!b) return; col = b.dataset.col; $('#ce-icons', s).style.setProperty('--c', col); s.querySelectorAll('#ce-colors button').forEach((x) => x.setAttribute('aria-pressed', x === b)); };
  $('#ce-save', s).onclick = () => {
    const name = $('#ce-name', s).value.trim();
    if (!name) { toast('Введите название'); $('#ce-name', s).focus(); return; }
    const raw = $('#ce-limit', s).value.trim();
    const lim = raw ? parseAmount(raw) : null;
    if (raw && !(lim > 0)) { toast('Лимит должен быть числом больше нуля'); return; }
    const type = s.querySelector('input[name=ce-type]:checked').value;
    if (c) {
      Object.assign(c, { name, icon: ic, color: col, type });
      if (lim !== limit) setLimitFrom(c.limits, view, lim);
    } else {
      S.categories.push({ id: uid(), name, icon: ic, color: col, type, created: view, limits: { [view]: lim } });
    }
    save(); render(); closeSheet(); toast(c ? 'Категория сохранена' : 'Категория создана');
  };
  const del = $('#ce-del', s);
  if (del) del.onclick = () => {
    if (!del.classList.contains('armed')) {
      del.classList.add('armed');
      del.textContent = count ? `Удалить вместе с ${count} ${count % 10 === 1 && count % 100 !== 11 ? 'тратой' : 'тратами'}? Нажмите ещё раз` : 'Нажмите ещё раз, чтобы удалить';
      return;
    }
    S.categories = S.categories.filter((x) => x.id !== c.id);
    S.tx = S.tx.filter((t) => t.cat !== c.id);
    save(); render(); closeSheet(); toast('Категория удалена');
  };
}

/* --- settings --- */
function openSettings() {
  const budget = limitAt(S.budget, view);
  const s = openSheet(`
    <div class="sheet-head"><h2>Настройки</h2>${closeBtn}</div>
    <label class="field"><span>Общий бюджет на месяц, ₽ — с ${esc(monthIn(view))} и дальше</span>
      <input class="input num" id="st-budget" inputmode="decimal" placeholder="Не задан" value="${budget ?? ''}"></label>
    <button class="btn soft" id="st-budget-save">Сохранить бюджет</button>
    <hr>
    <label class="switch"><input type="checkbox" id="st-pace" ${S.settings.pace ? 'checked' : ''}>
      <span><b>Подсвечивать темп трат</b><br><span class="sub">Сравнивает, какая доля лимита потрачена, с тем, какая доля месяца прошла. Первые дни месяца считаются как 12% лимита, чтобы одна покупка не красила всё в красный. Когда выключено, красным выделяется только перерасход.</span>
      <span class="legend"><span><i class="dot" style="background:var(--ok)"></i>в темпе</span><span><i class="dot" style="background:var(--warn)"></i>чуть быстрее</span><span><i class="dot" style="background:var(--danger)"></i>заметно быстрее или перерасход</span></span></span>
    </label>
    <hr>
    <div class="field"><span>Данные хранятся только на этом устройстве. Делайте копию раз в пару недель.</span></div>
    <div class="actions">
      <button class="btn soft" id="st-export">Сохранить копию данных</button>
      <button class="btn soft" id="st-import">Загрузить копию</button>
    </div>
    <div id="st-out"></div>`);
  $('#st-budget-save', s).onclick = () => {
    const raw = $('#st-budget', s).value.trim();
    const v = raw ? parseAmount(raw) : null;
    if (raw && !(v > 0)) { toast('Бюджет должен быть числом больше нуля'); return; }
    setLimitFrom(S.budget, view, v); save(); render(); toast('Бюджет сохранён');
  };
  $('#st-pace', s).onchange = (e) => { S.settings.pace = e.target.checked; save(); render(); };
  $('#st-export', s).onclick = () => exportData($('#st-out', s));
  $('#st-import', s).onclick = () => $('#import-file').click();
}

async function exportData(out) {
  const json = JSON.stringify(S, null, 1);
  const name = `budget-${today()}.json`;
  try {
    const file = new File([json], name, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  try {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
    a.download = name; document.body.appendChild(a); a.click(); a.remove();
  } catch (e) {}
  out.innerHTML = `<label class="field"><span>Если файл не скачался, скопируйте текст и сохраните его в Заметках</span><textarea class="input" id="st-json" readonly>${esc(json)}</textarea></label>
    <button class="btn soft" id="st-copy">Скопировать</button>`;
  $('#st-copy', out).onclick = async () => {
    const ta = $('#st-json', out);
    try { await navigator.clipboard.writeText(json); toast('Скопировано'); } catch (e) { ta.focus(); ta.select(); }
  };
}
$('#import-file').addEventListener('change', (e) => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!d || !Array.isArray(d.categories) || !Array.isArray(d.tx)) throw new Error();
      d.settings = d.settings || { pace: false }; d.budget = d.budget || {};
      S = d; save(); render(); closeSheet(); toast(`Загружено: ${d.categories.length} категорий, ${d.tx.length} трат`);
    } catch (_) { toast('Файл не похож на копию данных этого приложения'); }
  };
  r.readAsText(f); e.target.value = '';
});

/* ---------- toast ---------- */
let toastTimer;
function toast(msg) {
  let t = $('.toast');
  if (!t) { t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); }
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.hidden = true), 2200);
}

/* ---------- boot ---------- */
$('#prev').innerHTML = icon('left');
$('#next').innerHTML = icon('right');
$('#settings-btn').innerHTML = icon('sliders');
$('#fab .plus').innerHTML = icon('plus');
const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
function goMonth(d) {
  if (d > 0 && view >= ymOf(today())) return;
  view = shiftYM(view, d); render();
  if (reduceMotion) return;
  [$('#budget'), $('#grid-wrap')].forEach((el) => el.animate && el.animate(
    [{ transform: `translateX(${d * 28}px)`, opacity: 0.25 }, { transform: 'none', opacity: 1 }],
    { duration: 200, easing: 'cubic-bezier(.2,.8,.2,1)' }));
}
$('#prev').onclick = () => goMonth(-1);
$('#next').onclick = () => goMonth(1);
// Horizontal swipe anywhere on the page switches months (not while dragging the budget circle).
(() => {
  let sx = null, sy = 0, t0 = 0;
  const area = $('#app');
  area.addEventListener('touchstart', (e) => {
    if (sheetEl || e.touches.length !== 1 || e.target.closest('#budget-src')) { sx = null; return; }
    sx = e.touches[0].clientX; sy = e.touches[0].clientY; t0 = Date.now();
  }, { passive: true });
  area.addEventListener('touchend', (e) => {
    if (sx == null) return;
    const t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    sx = null;
    if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.5 || Date.now() - t0 > 800) return;
    goMonth(dx < 0 ? 1 : -1);
  }, { passive: true });
})();
$('#settings-btn').onclick = openSettings;
$('#fab').onclick = () => openTx({});
document.addEventListener('visibilitychange', () => { if (!document.hidden && !sheetEl) render(); });

S = load();
render();
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (_) {}
if ('serviceWorker' in navigator && document.documentElement.classList.contains('pwa')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
})();
</script>
