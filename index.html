<title>Месячный бюджет</title>

<style>
/* Layout: one narrow column — month bar, budget card (drag source), 4-column category grid, floating "+" */
:root {
  --bg: #F3F4F1;
  --surface: #FFFFFF;
  --fg: #1B1E1C;
  --muted: #747A76;
  --line: #E2E5E0;
  --key: #E9ECE7;
  --track: #E6E9E4;
  --accent: #24584A;
  --accent-ink: #FFFFFF;
  --level-ink: #1F3B32;
  --danger: #D2382A;
  --danger-tint: #FCE9E6;
  --ok: #2F9A5B;
  --warn: #E0A019;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-num: -apple-system, BlinkMacSystemFont, "SF Pro Rounded", "SF Pro Display", "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { background: var(--bg); color: var(--fg); height: 100%; }
body { display: flex; flex-direction: column; overflow: hidden; }
body { font-family: var(--font); font-size: 15px; line-height: 1.35; }
.pwa body { padding-top: env(safe-area-inset-top, 0px); }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible, input:focus-visible, .seg label:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }

.app {
  flex: 1; min-height: 0; width: 100%; max-width: 520px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 2px 0;
  display: flex; flex-direction: column; gap: 10px;
}
.app > * { flex: none; }
/* keep the header clear of the system blur under the status bar / Dynamic Island */
.pwa .app { padding-top: 14px; }

/* month bar */
.bar { display: grid; grid-template-columns: 40px 1fr 40px; align-items: center; min-height: 44px; }
.month { grid-column: 2; justify-self: center; display: flex; align-items: center; gap: 0; transition: opacity .2s; }
body.toasting .month { opacity: 0; }
.month h1 { font-size: 20px; font-weight: 700; margin: 0; min-width: 6.6em; text-align: center; letter-spacing: -0.01em; white-space: nowrap; }
#settings-btn { grid-column: 3; }
.icon-btn { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; color: var(--fg); }
.icon-btn:active { background: var(--track); }
.icon-btn[disabled] { opacity: .25; cursor: default; }
.icon-btn svg { width: 22px; height: 22px; }

/* demo banner */
.demo { display: flex; align-items: center; gap: 12px; justify-content: space-between; background: #FFF6DD; color: #6A5312; border-radius: 14px; padding: 10px 12px; font-size: 13px; }
.demo button { font-weight: 600; white-space: nowrap; color: #6A5312; text-decoration: underline; }

/* Budget card as a level: the "water" = what is left of the month's budget, sinking as money is spent.
   Water and the empty part are close in tone, so the text keeps one colour over both and is never cut by the waterline.
   Two looks, switched in settings (S.settings.card): dark (default) and light. */
.budget { display: block; }
.bcard { --top: #4A8070; --water: #1F4F42; --ink: #fff; position: relative; display: block; width: 100%; height: 138px; border-radius: 22px; overflow: hidden; text-align: left; background: var(--top); color: var(--ink); touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; transition: transform .15s, opacity .15s; }
.bcard.light { --top: var(--surface); --water: #BFD5C7; --ink: var(--level-ink); }
.bcard.over { --top: var(--danger-tint); --ink: var(--danger); }
.bcard .water { position: absolute; left: 0; right: 0; bottom: 0; background: var(--water); }
.bcard .layer { position: absolute; inset: 0; padding: 14px 18px 12px; display: flex; flex-direction: column; }
.bcard .lab { font-size: 11px; letter-spacing: .09em; font-weight: 700; text-transform: uppercase; opacity: .8; }
.bcard .big { font-family: var(--font-num); font-size: 38px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; margin-top: 4px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.bcard .sp { font-size: 13px; margin-top: 4px; opacity: .85; font-variant-numeric: tabular-nums; }
.bcard .hint { margin-top: auto; font-size: 12px; opacity: .72; line-height: 1.3; }
.bcard.lifted { transform: scale(.97); opacity: .6; }
.label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }

/* disc + ring (shared by budget and categories) */
.disc { position: relative; display: block; width: 100%; height: 100%; }
.disc svg.ring { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
.disc-in { position: absolute; inset: 9%; border-radius: 50%; display: grid; place-items: center; background: var(--tint, var(--track)); color: var(--c, var(--muted)); }
.disc-in svg { width: 44%; height: 44%; }
.disc.nolimit .disc-in { background: var(--track); }
.disc.over .disc-in { background: var(--danger-tint); }

/* category tiles: 2 columns; only the grid scrolls when there are many */
.grid-wrap { flex: 1 1 auto !important; min-height: 0; }
.grid-wrap { margin: -10px -10px 0; }
.grid { height: 100%; overflow-y: auto; overscroll-behavior: contain; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; align-content: start; padding: 10px 10px 12px; }
.cat { background: var(--surface); border-radius: 16px; padding: 9px 12px 10px; display: flex; flex-direction: column; align-items: stretch; gap: 4px; min-width: 0; min-height: 70px; text-align: left; transition: transform .12s, box-shadow .12s; }
.cat:active { transform: scale(.98); }
.cat-name { display: flex; align-items: center; gap: 6px; font-size: 13.5px; min-width: 0; }
.cat-name svg { width: 17px; height: 17px; flex: none; color: var(--c); }
.cat-name span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cat-val { display: flex; align-items: baseline; gap: 5px; min-width: 0; white-space: nowrap; overflow: hidden; }
.cat-spent { font-size: 17px; font-weight: 700; }
.cat-limit { font-size: 11.5px; color: var(--muted); }
.cat.over .cat-spent, .cat.over .cat-limit { color: var(--danger); }
.pb { display: block; height: 4px; border-radius: 2px; background: var(--track); margin-top: auto; overflow: hidden; }
.pb i { display: block; height: 100%; border-radius: 2px; }
.cat.add { background: transparent; border: 1.5px dashed #C3C8C2; flex-direction: row; align-items: center; justify-content: center; gap: 6px; font-weight: 600; color: var(--muted); }
.cat.add svg { width: 18px; height: 18px; }
body.dragging .cat:not(.add) { box-shadow: 0 0 0 1.5px var(--line); }
.cat.drop { box-shadow: 0 0 0 2px var(--accent) !important; transform: scale(1.03); }

.ghost { position: fixed; left: 0; top: 0; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-size: 24px; font-weight: 700; pointer-events: none; z-index: 50; box-shadow: 0 8px 24px rgba(20,40,30,.3); }

/* Bottom bar: full width, a soft hill that peaks in the middle; the whole bar adds an expense. */
.addbar { flex: none; position: relative; display: block; width: 100%; height: calc(56px + env(safe-area-inset-bottom, 0px)); color: var(--accent-ink); z-index: 5; }
.addbar .shape { position: absolute; left: 0; top: 0; width: 100%; height: 56px; display: block; filter: drop-shadow(0 -3px 10px rgba(20,60,45,.16)); }
.addbar .shape path { fill: var(--accent); }
.addbar::after { content: ""; position: absolute; left: 0; right: 0; top: 55px; bottom: 0; background: var(--accent); }
.addbar .plus { position: absolute; left: 50%; top: 9px; width: 40px; height: 40px; margin-left: -20px; display: grid; place-items: center; transition: transform .12s; }
.addbar .plus svg { width: 36px; height: 36px; stroke-width: 2.4; }
.addbar:active .plus { transform: scale(.9); }
.addbar:focus-visible { outline: none; }
.addbar:focus-visible .plus { outline: 2px solid var(--accent-ink); outline-offset: 2px; border-radius: 50%; }

/* sheets */
.backdrop { position: fixed; inset: 0; background: rgba(20,24,22,.32); z-index: 20; opacity: 0; transition: opacity .29s ease-out; }
.backdrop.on { opacity: 1; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; max-width: 560px; margin: 0 auto; max-height: 92dvh; overflow-y: auto; overscroll-behavior: contain; background: var(--surface); border-radius: 22px 22px 0 0; padding: 8px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); transform: translateY(100%); transition: transform .34s cubic-bezier(.32,.72,0,1); display: flex; flex-direction: column; gap: 14px; }
.sheet.on { transform: none; }
@media (prefers-reduced-motion: reduce) {
  .cat { transition: none; }
  .sheet { transform: none; opacity: 0; transition: opacity .2s; }
  .sheet.on { opacity: 1; }
  .backdrop { transition: opacity .2s; }
}
.grab-zone { flex: none; margin: -8px 0 -6px; padding: 8px 0 10px; touch-action: none; cursor: grab; }
.grab { width: 36px; height: 5px; border-radius: 3px; background: #D5D9D4; margin: 0 auto; }
.sheet-head { touch-action: none; }
.sheet-head { display: flex; align-items: center; gap: 10px; min-height: 40px; }
.sheet-head h2 { font-size: 18px; margin: 0; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sheet-head .disc { width: 40px; height: 40px; flex: none; }

.amount { display: flex; align-items: baseline; gap: 6px; border-bottom: 2px solid var(--line); padding-bottom: 4px; }
.amount:focus-within { border-color: var(--accent); }
.amount input { flex: 1; min-width: 0; border: 0; outline: 0; font-family: var(--font-num); font-size: 38px; font-weight: 700; padding: 0; background: transparent; color: var(--fg); }
.amount span { font-size: 28px; color: var(--muted); font-weight: 600; }
.row { display: flex; gap: 8px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; flex: 1; }
.field > span { font-size: 12px; color: var(--muted); }
.input { width: 100%; font: inherit; font-size: 16px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); min-width: 0; -webkit-appearance: none; appearance: none; }
input[type=date].input { min-height: 44px; }
.row .field.date { flex: 0 0 140px; }

.pick { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 2px 4px; }
.pick button { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 4px 2px; border-radius: 14px; min-width: 0; }
.pick .disc { width: 38px; height: 38px; }
.pick small { font-size: 10.5px; color: var(--muted); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pick button[aria-pressed=true] { background: color-mix(in srgb, var(--accent) 10%, transparent); }
.pick button[aria-pressed=true] .disc-in { background: var(--accent); color: var(--accent-ink); }
.pick button[aria-pressed=true] small { color: var(--fg); font-weight: 600; }
/* Category chips in the expense sheet: flat, neutral, in 2–3 rows that scroll sideways together, edge to edge */
.chips { position: relative; flex: none; overflow-x: auto; overflow-y: hidden; overscroll-behavior-x: contain; scrollbar-width: none; touch-action: pan-x;
  margin-left: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); margin-right: calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
  padding: 2px max(16px, env(safe-area-inset-right, 0px)) 2px max(16px, env(safe-area-inset-left, 0px)); }
.chips::-webkit-scrollbar { display: none; }
.chips-in { display: flex; flex-direction: column; gap: 8px; width: max-content; }
.chips-row { display: flex; gap: 8px; }
.chip { height: 38px; padding: 0 15px; border-radius: 19px; background: var(--bg); border: 1px solid var(--line); color: var(--fg); font-size: 15px; font-weight: 500; white-space: nowrap; transition: background .12s, color .12s; }
.chip:active { background: var(--line); }
.chip[aria-pressed=true] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.sub { font-size: 13px; color: var(--muted); }
.sub.tight { font-size: 12px; margin-top: -4px; }

/* Expense sheet: own keypad instead of the iOS keyboard */
.sheet.txs { padding-bottom: 0; gap: 10px; }
.sheet.txs .sheet-head { margin-top: -2px; }
/* While typing, the sheet stays pinned to the screen bottom and the tray is swapped for white padding of the keyboard
   height (--kb), in the same frame and without animation: the sheet keeps about the same height, so it neither dips
   nor jumps, and the keyboard slides over white. */
.sheet.txs.typing { padding-bottom: calc(4px + var(--kb, 0px)); max-height: none; }
/* until the comment is tapped, a long press must not select text or focus the field natively (iOS would scroll the page) */
.sheet.txs:not(.typing) #tx-comment[readonly] { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.sheet.txs.typing .tray { display: none; }
/* Bottom tray "where": categories + keypad on the grey keyboard surface, edge to edge */
.tray { flex: none; display: flex; flex-direction: column; gap: 12px; background: var(--bg); padding-top: calc(14px + var(--tray-extra, 0px)); margin-top: 6px;
  margin-left: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); margin-right: calc(-1 * max(16px, env(safe-area-inset-right, 0px))); }
.tray .chips { margin-left: 0; margin-right: 0; }
.tray .chip { background: var(--surface); border-color: transparent; box-shadow: 0 1px 0 rgba(0,0,0,.07); }
.tray .chip:active { background: var(--line); }
.tray .chip[aria-pressed=true] { background: var(--accent); border-color: var(--accent); box-shadow: none; }
.tray .pad-area { margin-left: 0; margin-right: 0; padding-top: 0; }
#tx-title { display: flex; align-items: center; gap: 6px; }
#tx-title .arrow { display: grid; color: var(--muted); }
#tx-title .arrow svg { width: 18px; height: 18px; }
#tx-title .disc { width: 28px; height: 28px; flex: none; }
#tx-title .tname { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.amt-row { display: flex; align-items: stretch; gap: 10px; }
.amt { flex: 1; min-width: 0; height: 56px; display: flex; align-items: flex-end; gap: 6px; border-bottom: 2px solid var(--accent); padding-bottom: 7px; cursor: text; }
.amt b { font-family: var(--font-num); font-size: 38px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; line-height: 1; }
.amt b.blank { color: #B9BEBA; }
.amt .cur { margin-left: auto; font-size: 28px; line-height: 1; color: var(--muted); font-weight: 600; padding-bottom: 2px; }
.caret { display: inline-block; width: 2px; height: 0.8em; background: var(--accent); margin-left: 2px; vertical-align: -0.04em; animation: blink 1s steps(1) infinite; }
.typing .caret { visibility: hidden; }
@keyframes blink { 50% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .caret { animation: none; } }
/* Date wheel, iOS-alarm style: rows sit on a cylinder, the selected one in a band.
   The chip shows only the date; touching it pops a 5-row wheel over the form. */
.datechip { position: relative; flex: none; width: 144px; height: 56px; border-radius: 14px; background: var(--bg); border: 1px solid var(--line); overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; cursor: ns-resize; }
.datechip .dlabel { position: absolute; inset: 0; padding: 0 30px 0 10px; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; transition: opacity .12s; }
/* the date and the tag button put their arrow in the same place: same size, colour and distance from the right edge */
.datechip .dlabel svg, .tagbtn .tb-arrow { position: absolute; right: 9px; top: 50%; margin-top: -8px; width: 16px; height: 16px; color: #A3A9A5; }
.datechip.open .dlabel { opacity: .25; }
.wheel { position: absolute; inset: 0; perspective: 260px; pointer-events: none; }
.wheel::before { content: ""; position: absolute; left: 6px; right: 6px; top: 50%; height: var(--band); margin-top: calc(var(--band) / -2); border-radius: 8px; background: var(--key); }
.wrow { position: absolute; left: 0; right: 0; top: 50%; height: var(--rh); margin-top: calc(var(--rh) / -2); display: flex; align-items: center; justify-content: center; font-size: var(--fs); color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; backface-visibility: hidden; will-change: transform, opacity; }
.wrow.sel { color: var(--fg); font-weight: 600; }
.wheelpop { position: fixed; z-index: 30; width: 172px; height: 178px; border-radius: 18px; background: var(--surface); box-shadow: 0 12px 32px rgba(16,30,22,.2), 0 0 0 1px rgba(0,0,0,.05); touch-action: none; user-select: none; -webkit-user-select: none; overflow: hidden; animation: wpin .18s cubic-bezier(.3,.7,.3,1); }
.wheelpop.out { animation: wpout .14s ease-in forwards; }
.wheelpop .wheel { --rh: 34px; --band: 36px; --fs: 20px; perspective: 380px; }
.wheelpop .wheel::before { left: 8px; right: 8px; border-radius: 10px; background: var(--bg); }
@keyframes wpin { from { opacity: 0; transform: scaleY(.45); } }
@keyframes wpout { to { opacity: 0; transform: scaleY(.6); } }
@media (prefers-reduced-motion: reduce) { .wheelpop, .wheelpop.out { animation: none; } }
.pad-area { flex: none; background: var(--bg);
  margin-left: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); margin-right: calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
  padding: 8px max(8px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
.keypad { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.keypad button { height: var(--key-h, 48px); border-radius: 10px; background: var(--surface); font-family: var(--font-num); font-size: 24px; font-weight: 500; display: grid; place-items: center; box-shadow: 0 1px 0 rgba(0,0,0,.08); touch-action: manipulation; user-select: none; -webkit-user-select: none; }
.keypad button.f { background: var(--key); }
.keypad button.ok { background: var(--accent); color: var(--accent-ink); }
.keypad button.ok svg { width: 26px; height: 26px; stroke-width: 2.6; }
.keypad button.ok:disabled { background: var(--key); color: #B3B8B4; box-shadow: none; cursor: default; }
.keypad button.ok:not(:disabled):active { transform: scale(.94); }
/* ✓ confirms: the key springs and the tick redraws */
.keypad button.ok.pop { animation: okpop .26s ease-out; }
.keypad button.ok.pop svg path { stroke-dasharray: 24; animation: okdraw .22s ease-out; }
@keyframes okpop { 0% { transform: scale(1); } 30% { transform: scale(.86); } 65% { transform: scale(1.07); } 100% { transform: scale(1); } }
@keyframes okdraw { from { stroke-dashoffset: 24; } to { stroke-dashoffset: 0; } }
@media (prefers-reduced-motion: reduce) { .keypad button.ok.pop, .keypad button.ok.pop svg path { animation: none; } }
.sheet-head .del { color: var(--danger); }
.sheet-head .del.armed { background: var(--danger); color: #fff; }
.keypad button:active { background: var(--line); }
.keypad svg { width: 24px; height: 24px; }
.row-actions { flex-direction: row; }
.row-actions .btn.primary { flex: 1; }
.btn.icon-only { width: 50px; padding: 0; flex: none; background: var(--danger-tint); }
.btn.icon-only.armed { background: var(--danger); color: #fff; }
.btn { min-height: 50px; border-radius: 14px; font-weight: 600; font-size: 16px; padding: 0 16px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.primary[disabled] { background: var(--key); color: #A3A9A5; cursor: default; }
.btn.soft { background: var(--bg); }
.btn.danger { color: var(--danger); }
.btn.danger.armed { background: var(--danger); color: #fff; }
.btn svg { width: 20px; height: 20px; }
.actions { display: flex; flex-direction: column; gap: 8px; }

.summary { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 14px; color: var(--muted); }
.summary b { color: var(--fg); font-weight: 600; }
.summary .over { color: var(--danger); font-weight: 600; }
.day { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; font-weight: 600; margin-top: 4px; }
.tx { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); width: 100%; text-align: left; }
.tx .c { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tx .c.none { color: var(--muted); }
.tx .a { font-weight: 600; white-space: nowrap; }
.list { display: flex; flex-direction: column; }
.empty { color: var(--muted); text-align: center; padding: 20px 0; }

.seg { display: flex; background: var(--bg); border-radius: 12px; padding: 3px; }
.seg label { flex: 1; text-align: center; padding: 8px 4px; border-radius: 10px; font-size: 14px; cursor: pointer; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label:has(input:checked) { background: var(--surface); box-shadow: 0 1px 3px rgba(0,0,0,.1); font-weight: 600; }

let suppressClick = false;
function setupDrag(src) {
  let start = null, dragging = false, ghost = null, overEl = null, timer = null;
  const begin = (x, y) => {
    if (dragging) return;
    dragging = true; clearTimeout(timer);
    src.classList.add('lifted'); document.body.classList.add('dragging');
    ghost = document.createElement('div'); ghost.className = 'ghost'; ghost.textContent = '₽';
    document.body.appendChild(ghost); move(x, y);
  };
  const move = (x, y) => {
    ghost.style.transform = `translate(${x}px, ${y}px)`;
    const el = document.elementFromPoint(x, y);
    const target = el && el.closest('.cat[data-cat]');
    if (target !== overEl) { overEl && overEl.classList.remove('drop'); overEl = target; overEl && overEl.classList.add('drop'); }
  };
  const finish = () => {
    clearTimeout(timer);
    const id = overEl && overEl.dataset.cat;
    overEl && overEl.classList.remove('drop');
    ghost && ghost.remove();
    src.classList.remove('lifted'); document.body.classList.remove('dragging');
    const wasDragging = dragging;
    start = null; dragging = false; ghost = null; overEl = null;
    return { wasDragging, id };
  };
  src.addEventListener('contextmenu', (e) => e.preventDefault());
  src.addEventListener('pointerdown', (e) => {
    if (e.button > 0) return;
    start = { x: e.clientX, y: e.clientY };
    try { src.setPointerCapture(e.pointerId); } catch (_) {}
    timer = setTimeout(() => start && begin(start.x, start.y), 250);
  });
  src.addEventListener('pointermove', (e) => {
    if (!start) return;
    if (!dragging && Math.hypot(e.clientX - start.x, e.clientY - start.y) > 6) begin(e.clientX, e.clientY);
    if (dragging) move(e.clientX, e.clientY);
  });
  src.addEventListener('pointerup', () => {
    if (!start) return;
    const { wasDragging, id } = finish();
    if (wasDragging) { suppressClick = true; setTimeout(() => (suppressClick = false), 400); if (id) openTx({ catId: id }); }
  });
  src.addEventListener('pointercancel', finish);
  src.addEventListener('click', () => { if (suppressClick) { suppressClick = false; return; } openTx({}); });
}

    anims.push(() => a1.cancel());
    if (!RM) {
      const a2 = tile.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.06)' }, { transform: 'scale(1)' }], { duration: 460, easing: 'cubic-bezier(.3,.7,.4,1)' });
      anims.push(() => a2.cancel());
      const c = catById(catId), lim = limitAt(c.limits, view);
      const was = before.spentBy[catId] || 0, now = after.spentBy[catId] || 0;
      countUp([tile.querySelector('.cat-spent')], was, now, rub);
      const bi = tile.querySelector('.pb i');
      if (bi) {
        const fin = bi.style.width;
        bi.style.transition = 'none'; bi.style.width = barWidth(was, lim) + '%'; void bi.offsetWidth;
        bi.style.transition = 'width .65s cubic-bezier(.3,.7,.3,1)'; bi.style.width = fin;
      }
      // crossing the limit: red and "+N ₽" appear when the count-up ends
      if (lim != null && now > lim && !(was > lim)) {
        const sub = tile.querySelector('.cat-limit'), finSub = sub.textContent, finCol = tile.style.getPropertyValue('--c');
        const prevCol = STATE_COLOR[catState(c, was, lim, view)];
        tile.classList.remove('over'); sub.textContent = `/ ${rub(lim)}`;
        tile.style.setProperty('--c', prevCol); if (bi) bi.style.background = prevCol;
        later(() => { tile.classList.add('over'); sub.textContent = finSub; tile.style.setProperty('--c', finCol); if (bi) bi.style.background = finCol; }, 520);
      }
    }
  }
  if (RM) return;
  // budget card: count "left" down and lower the level, when the card stays in the same state
  const budget = limitAt(S.budget, view);
  const bigs = [...document.querySelectorAll('#budget .big')];
  if (budget == null) countUp(bigs, before.total, after.total, rub);
  else {
    const was = budget - before.total, now = budget - after.total;
    if (was >= 0 && now >= 0) {
      countUp(bigs, was, now, rub);
      const w = $('#budget .water');
      if (w) {
        const a3 = w.animate([{ height: `${(was / budget * 100).toFixed(2)}%` }, { height: w.style.height }], { duration: 520, easing: 'cubic-bezier(.3,.7,.3,1)' });
        anims.push(() => a3.cancel());
      }
    }
  }
}

/* --- category: list of expenses --- */
function openCategory(id) {
  const c = catById(id); if (!c) return;
  const txs = txIn(view).filter((t) => t.cat === id).sort((a, b) => b.date.localeCompare(a.date) || (b.id > a.id ? 1 : -1));
  const spent = txs.reduce((a, t) => a + t.amount, 0);
  const limit = limitAt(c.limits, view);
  let list = '', lastDay = '';
  for (const t of txs) {
    if (t.date !== lastDay) {
      lastDay = t.date;
      const [y, m, d] = t.date.split('-').map(Number);
      list += `<div class="day">${new Date(y, m - 1, d).toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', weekday: 'short' })}</div>`;

/* --- tags --- */
const tagById = (id) => S.tags.find((g) => g.id === id);
const normTag = (v) => String(v || '').replace(/\s+/g, ' ').trim();
const tagKey = (v) => normTag(v).toLowerCase().replace(/ё/g, 'е');
const tagCount = (id) => S.tx.filter((t) => Array.isArray(t.tags) && t.tags.includes(id)).length;
const plural = (n, f) => { const a = n % 100, b = n % 10; return a > 10 && a < 20 ? f[2] : b === 1 ? f[0] : b >= 2 && b <= 4 ? f[1] : f[2]; };

function openTagsPage({ onBack } = {}) {
  if (pageEl) return;
  const pg = document.createElement('div');
  pg.className = 'page'; pg.setAttribute('role', 'dialog'); pg.setAttribute('aria-modal', 'true');
  pg.innerHTML = `<div class="page-bar"><button class="icon-btn" id="tp-back" aria-label="Назад">${icon('left')}</button><h1 id="tp-title"></h1></div><div class="page-body" id="tp-body"></div>`;
  document.body.appendChild(pg); pageEl = pg;
  requestAnimationFrame(() => pg.classList.add('on'));
  const body = $('#tp-body', pg);
  let editing = null, adding = false, addDraft = '';
  const close = () => {
    if (pageEl !== pg) return;
    pageEl = null; pg.classList.remove('on');
    setTimeout(() => pg.remove(), reduceMotion() ? 0 : 340);
    if (onBack) onBack();
  };
  pg._close = close;
  $('#tp-back', pg).onclick = close;

  const countText = (id) => { const n = tagCount(id); return n ? `${n} ${plural(n, ['трата', 'траты', 'трат'])}` : 'Не используется'; };
  const rowHtml = (g) => editing === g.id
    ? `<div class="trow2 editing" data-id="${g.id}"><div class="tedit"><input class="tinput" id="tp-edit" maxlength="14" autocomplete="off" enterkeyhint="done" value="${esc(g.name)}" aria-label="Название тега"><div class="tmeta"><span class="terr" id="tp-edit-err"></span><span class="tcount" id="tp-edit-count"></span></div></div><button class="btn primary sm" id="tp-done">Готово</button></div>`
    : `<div class="trow2" data-id="${g.id}"><button class="grip" aria-label="Перетащить «${esc(g.name)}». Стрелки вверх и вниз меняют порядок">${icon('grip')}</button><button class="tinfo" data-ren aria-label="Переименовать «${esc(g.name)}»"><span class="tname">${esc(g.name)}</span><span class="tcnt">${countText(g.id)}</span></button><button class="tact" data-ren aria-label="Переименовать">${icon('pencil')}</button><button class="tact del" data-del aria-label="Удалить «${esc(g.name)}»">${icon('trash')}</button></div>`;

  function render(focusGripOf) {
    const n = S.tags.length, atLimit = n >= 15;
    $('#tp-title', pg).textContent = `Теги · ${n}/15`;
    body.innerHTML = `<p class="thint">Зажмите ≡ для изменения порядка тегов, в котором они будут отображаться при внесении расходов</p>`
      + (n ? `<div class="tcard" id="tp-list">${S.tags.map(rowHtml).join('')}</div>` : `<div class="tcard empty-card">Тегов пока нет</div>`)
      + (adding
        ? `<div class="tcard create"><input class="tinput" id="tp-new" maxlength="14" autocomplete="off" enterkeyhint="done" placeholder="Название тега" value="${esc(addDraft)}" aria-label="Название тега"><div class="tmeta"><span class="terr" id="tp-new-err"></span><span class="tcount" id="tp-new-count"></span></div><div class="row"><button class="btn soft sm" id="tp-cancel">Отмена</button><button class="btn primary sm" id="tp-add-ok" disabled>Добавить</button></div></div>`
        : `<button class="tadd-btn" id="tp-add" ${atLimit ? 'disabled' : ''}>${icon('plus')} Добавить</button>${atLimit ? '<p class="thint">Можно создать до 15 тегов. Удалите ненужный, чтобы добавить новый</p>' : ''}`);
    // rename
    body.querySelectorAll('[data-ren]').forEach((b) => b.onclick = () => { if (editing || adding) return; editing = b.closest('.trow2').dataset.id; render(); const i = $('#tp-edit', pg); i.focus(); i.setSelectionRange(i.value.length, i.value.length); });
    const ed = $('#tp-edit', pg);
    if (ed) {
      const g = tagById(editing);
      const v = () => { const nm = normTag(ed.value); const dup = nm ? S.tags.find((o) => o.id !== g.id && tagKey(o.name) === tagKey(nm)) : null;
        const c = $('#tp-edit-count', pg); c.textContent = `${ed.value.length}/14`; c.classList.toggle('max', ed.value.length >= 14);
        ed.classList.toggle('err', !!dup); $('#tp-edit-err', pg).textContent = dup ? 'Такой тег уже есть' : '';
        $('#tp-done', pg).disabled = !!dup; return { nm, dup }; };
      const done = () => { const { nm, dup } = v(); if (dup) return; if (nm && nm !== g.name) { g.name = nm; save(); } editing = null; render(); };
      ed.addEventListener('input', v); ed.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); done(); } });
      $('#tp-done', pg).onclick = done; v();
    }
    // delete
    body.querySelectorAll('[data-del]').forEach((b) => b.onclick = () => { if (editing) return; confirmDelete(tagById(b.closest('.trow2').dataset.id)); });
    // add
    const ab = $('#tp-add', pg);
    if (ab) ab.onclick = () => { if (editing) return; adding = true; render(); $('#tp-new', pg).focus(); };
    const ni = $('#tp-new', pg);
    if (ni) {
      const v = () => { const nm = normTag(ni.value); const dup = nm ? S.tags.find((o) => tagKey(o.name) === tagKey(nm)) : null;
        const c = $('#tp-new-count', pg); c.textContent = `${ni.value.length}/14`; c.classList.toggle('max', ni.value.length >= 14);
        ni.classList.toggle('err', !!dup); $('#tp-new-err', pg).textContent = dup ? 'Такой тег уже есть' : '';
        const ok = !!nm && !dup && S.tags.length < 15; $('#tp-add-ok', pg).disabled = !ok; return { nm, ok }; };
      const add = () => { const { nm, ok } = v(); if (!ok) return; S.tags.push({ id: uid(), name: nm }); save(); adding = false; addDraft = ''; render(); };
      ni.addEventListener('input', () => { addDraft = ni.value; v(); });
      ni.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); add(); } });
      $('#tp-add-ok', pg).onclick = add;
      $('#tp-cancel', pg).onclick = () => { adding = false; addDraft = ''; render(); };
      v();
    }
    // keyboard reordering
    body.querySelectorAll('.grip').forEach((gb) => gb.addEventListener('keydown', (e) => {
      if (e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;
      e.preventDefault();
      const id = gb.closest('.trow2').dataset.id, i = S.tags.findIndex((g) => g.id === id), j = i + (e.key === 'ArrowUp' ? -1 : 1);
      if (j < 0 || j >= S.tags.length) return;
      const [g] = S.tags.splice(i, 1); S.tags.splice(j, 0, g); save(); render(id);
    }));
    if (focusGripOf) { const r = body.querySelector(`.trow2[data-id="${focusGripOf}"] .grip`); if (r) r.focus(); }
  }

  // drag to reorder, with auto-scroll near the edges of the visible list
  body.addEventListener('pointerdown', (e) => {
    const grip = e.target.closest('.grip'); if (!grip || editing || adding) return;
    e.preventDefault();
    const list = $('#tp-list', pg), rowEl = grip.closest('.trow2'), rows = [...list.children];
    const from = rows.indexOf(rowEl), h = rowEl.offsetHeight;
    const grabOff = e.clientY - rowEl.getBoundingClientRect().top;
    let y = e.clientY, to = from, raf = 0;
    rowEl.classList.add('dragging'); rows.forEach((r) => { if (r !== rowEl) r.classList.add('shift'); });
    try { grip.setPointerCapture(e.pointerId); } catch (_) {}
    const update = () => {
      const lt = list.getBoundingClientRect().top;
      const top = Math.max(0, Math.min((rows.length - 1) * h, y - lt - grabOff));
      rowEl.style.transform = `translateY(${top - from * h}px) scale(1.03)`;
      to = Math.round(top / h);
      rows.forEach((r, i) => {
        if (r === rowEl) return;
        let d = 0;
        if (from < to && i > from && i <= to) d = -h;
        if (from > to && i >= to && i < from) d = h;
        r.style.transform = d ? `translateY(${d}px)` : '';
      });
    };
    const tick = () => {
      const br = body.getBoundingClientRect(), zone = 60, max = h / 100 * 16;
      let v = 0;
      if (y < br.top + zone) v = -max * Math.min(1, (br.top + zone - y) / zone);
      else if (y > br.bottom - zone) v = max * Math.min(1, (y - (br.bottom - zone)) / zone);
      if (v) { const st = body.scrollTop; body.scrollTop += v; if (body.scrollTop !== st) update(); }
      raf = requestAnimationFrame(tick);
    };
    const move = (ev) => { y = ev.clientY; update(); };
    const up = () => {
      cancelAnimationFrame(raf);
      grip.removeEventListener('pointermove', move); grip.removeEventListener('pointerup', up); grip.removeEventListener('pointercancel', up);
      if (to !== from) { const [g] = S.tags.splice(from, 1); S.tags.splice(to, 0, g); save(); }
      render();
    };
    grip.addEventListener('pointermove', move); grip.addEventListener('pointerup', up); grip.addEventListener('pointercancel', up);
    update(); raf = requestAnimationFrame(tick);
  });

  function confirmDelete(g) {
    const n = tagCount(g.id);
    const ov = document.createElement('div'); ov.className = 'confirm'; ov.setAttribute('role', 'alertdialog');
    ov.innerHTML = `<div class="cbg"></div><div class="csheet"><h3>Удалить тег «${esc(g.name)}»?</h3><p>${n ? `Тег снимется с ${n} ${plural(n, ['траты', 'трат', 'трат'])}. Сами траты останутся.` : 'Тег не используется ни в одной трате.'}</p><button class="btn cdel">Удалить</button><button class="btn soft ccancel">Отмена</button></div>`;
    document.body.appendChild(ov);
    const shut = () => ov.remove();
    $('.cbg', ov).onclick = shut; $('.ccancel', ov).onclick = shut;
    $('.cdel', ov).onclick = () => {
      S.tags = S.tags.filter((x) => x.id !== g.id);
      S.tx.forEach((t) => { if (Array.isArray(t.tags)) t.tags = t.tags.filter((x) => x !== g.id); });
      save(); shut(); render(); toast('Тег удалён');
    };
  }
  render();
}

/* --- money inputs: 150000 → 150 000 while typing --- */
function bindGrouped(inp) {
  const fmt = () => {
    const pos = inp.selectionStart == null ? inp.value.length : inp.selectionStart;
    const before = inp.value.slice(0, pos).replace(/[^\d,.]/g, '').length;
    const raw = inp.value.replace(/\./g, ',').replace(/[^\d,]/g, '');
    const [i, ...rest] = raw.split(',');
    let out = (i || '').replace(/^0+(?=\d)/, '').replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
    if (rest.length) out += ',' + rest.join('').slice(0, 2);
    if (out === inp.value) return;
    inp.value = out;
    let n = 0, p = 0;
    while (p < out.length && n < before) { if (/[\d,]/.test(out[p])) n++; p++; }
    if (document.activeElement === inp) { try { inp.setSelectionRange(p, p); } catch (_) {} }
  };
  inp.addEventListener('input', fmt);
  fmt();
}

async function exportData(out) {
  const json = JSON.stringify(S, null, 1);
  const name = `budget-${today()}.json`;
  try {
    const file = new File([json], name, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  try {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
    a.download = name; document.body.appendChild(a); a.click(); a.remove();
  } catch (e) {}
  out.innerHTML = `<label class="field"><span>Если файл не скачался, скопируйте текст и сохраните его в Заметках</span><textarea class="input" id="st-json" readonly>${esc(json)}</textarea></label>
    <button class="btn soft" id="st-copy">Скопировать</button>`;
  $('#st-copy', out).onclick = async () => {
    const ta = $('#st-json', out);
    try { await navigator.clipboard.writeText(json); toast('Скопировано'); } catch (e) { ta.focus(); ta.select(); }
  };
}
$('#import-file').addEventListener('change', (e) => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!d || !Array.isArray(d.categories) || !Array.isArray(d.tx)) throw new Error();
      fixSettings(d); d.budget = d.budget || {}; if (!Array.isArray(d.tags)) d.tags = [];
      S = d; save(); render(); closeSheet(); toast(`Загружено: ${d.categories.length} категорий, ${d.tx.length} трат`);
    } catch (_) { toast('Файл не похож на копию данных этого приложения'); }
  };
  r.readAsText(f); e.target.value = '';
});

/* ---------- toast ---------- */
let toastTimer = null, toastEl = null, toastOut = null;
function toast(msg) {
  const RM = reduceMotion();
  if (!toastEl) { toastEl = document.createElement('div'); toastEl.className = 'toast'; toastEl.setAttribute('role', 'status'); toastEl.hidden = true; document.body.appendChild(toastEl); }
  const r = $('.bar').getBoundingClientRect();
  toastEl.style.top = (r.top + r.height / 2) + 'px';
  toastEl.textContent = msg;
  if (toastOut) { toastOut.cancel(); toastOut = null; }
  const wasShown = !toastEl.hidden;
  toastEl.hidden = false; document.body.classList.add('toasting');
  if (!wasShown && !RM) toastEl.animate([
    { opacity: 0, transform: 'translate(-50%, -50%) translateY(-14px) scale(.96)' },
    { opacity: 1, transform: 'translate(-50%, -50%)' }], { duration: 280, easing: 'cubic-bezier(.3,.7,.3,1)' });
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    const done = () => { toastEl.hidden = true; document.body.classList.remove('toasting'); toastOut = null; };
    if (RM) return done();
    toastOut = toastEl.animate([
      { opacity: 1, transform: 'translate(-50%, -50%)' },
      { opacity: 0, transform: 'translate(-50%, -50%) translateY(-6px)' }], { duration: 220, easing: 'ease-in' });
    toastOut.onfinish = done;
  }, 3600);
}

/* ---------- boot ---------- */
$('#prev').innerHTML = icon('left');
$('#next').innerHTML = icon('right');
$('#settings-btn').innerHTML = icon('sliders');
$('#fab .plus').innerHTML = icon('plus');
function goMonth(d) {
  if (d > 0 && view >= ymOf(today())) return;
  view = shiftYM(view, d); render();
}
$('#prev').onclick = () => goMonth(-1);
$('#next').onclick = () => goMonth(1);
$('#settings-btn').onclick = openSettings;
$('#fab').onclick = () => openTx({});
document.addEventListener('visibilitychange', () => { if (!document.hidden && !sheetEl) render(); });

// When the iOS keyboard opens, keep open sheets and pages above it.
// The keyboard height is remembered so the expense form can lift before the next keyboard appears.
let kbH = 0;
try { kbH = +localStorage.getItem('budget-kb-h') || 0; } catch (_) {}
// until measured: typical keyboard + ⌃⌄✓ bar height for the screen size (SE / regular / Plus & Pro Max)
const kbGuess = () => kbH || (innerHeight < 720 ? 304 : innerHeight < 900 ? 378 : 390);
// Make a layout change to a sheet and let its top glide from the old place to the new one (FLIP), instead of jumping.
function flipSheet(sh, change) {
  const t0 = sh.getBoundingClientRect().top;
  change();
  const d = Math.round(t0 - sh.getBoundingClientRect().top);
  if (!d || reduceMotion() || !sh.classList.contains('on')) return;
  sh.style.transition = 'none'; sh.style.transform = `translateY(${d}px)`;
  void sh.offsetHeight;
  sh.style.transition = ''; sh.style.transform = '';
}
// Make the tray (categories + keypad) as tall as the system keyboard, so swapping one for the other moves nothing.
// Extra height goes into the keys first (up to 58 px), the rest above the categories.
function fitTray(sh) {
  const tray = sh.querySelector('.tray'), row = sh.querySelector('.cmt-row');
  if (!tray || !row || sh.classList.contains('typing')) return;
  sh.style.removeProperty('--key-h'); sh.style.removeProperty('--tray-extra');
  const need = Math.round(row.getBoundingClientRect().bottom - sh.getBoundingClientRect().top + 4 + kbGuess() - sh.offsetHeight);
  if (need <= 0) return;
  const perKey = Math.min(10, Math.floor(need / 3));
  if (perKey) sh.style.setProperty('--key-h', (48 + perKey) + 'px');
  if (need - perKey * 3 > 0) sh.style.setProperty('--tray-extra', (need - perKey * 3) + 'px');
}
// Seat the expense form on the keyboard: the sheet keeps bottom 0, its white padding takes the keyboard height.
// If the sheet would come out lower than before typing (_h0), the padding grows by the difference so the sheet
// does not move at all; it only rises when the keyboard needs more room than the tray took.
function seatOnKeyboard(sh, kb) {
  if (!kb) { sh.style.removeProperty('--kb'); return; }
  sh.style.setProperty('--kb', kb + 'px');
  const lack = (sh._h0 || 0) - sh.offsetHeight;
  if (lack > 0 && sh.classList.contains('typing')) sh.style.setProperty('--kb', (kb + lack) + 'px');
}
const kbNow = () => { const vv = window.visualViewport; return vv ? Math.max(0, Math.round(innerHeight - vv.height - vv.offsetTop)) : 0; };
if (window.visualViewport) {
  const vv = window.visualViewport;
  const lift = () => {
    const kb = kbNow();
    if (sheetEl) {
      // the expense form follows the keyboard only while typing a comment or a new tag name;
      // after that the sheet goes straight down, behind the keyboard that is still leaving
      const txs = sheetEl.classList.contains('txs'), typing = sheetEl.classList.contains('typing');
      const own = !txs || typing || (document.activeElement && document.activeElement.id === 'tm-input');
      if (typing && kb > 120 && kb !== kbH) { kbH = kb; try { localStorage.setItem('budget-kb-h', kb); } catch (_) {} }
      if (typing) { if (kb) { const sh = sheetEl; flipSheet(sh, () => seatOnKeyboard(sh, kb)); } } // while the keyboard is still coming up, keep the early lift
      else {
        const k = own ? kb : 0;
        sheetEl.style.bottom = k ? k + 'px' : ''; sheetEl.style.maxHeight = k ? (vv.height - 8) + 'px' : '';
      }
    }
    if (pageEl) pageEl.style.bottom = kb ? kb + 'px' : '';
    if (sheetEl && sheetEl._placeMenu) sheetEl._placeMenu();
  };
  vv.addEventListener('resize', lift); vv.addEventListener('scroll', lift);
}

S = load();
if (!Array.isArray(S.tags)) S.tags = [];
render();
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (_) {}
if ('serviceWorker' in navigator && document.documentElement.classList.contains('pwa')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
})();
</script>
